name: preview

# Deploys a Netlify preview for every PR to develop/main and every push to
# develop. Each target gets a stable alias:
#   PR  →  https://pr-<number>--<site>.netlify.app
#   develop push → https://develop--<site>.netlify.app
#
# It deliberately does NOT run on a push to main. It used to, and that took
# production down for two days:
#
#   On a push the alias is the branch name, so a push to main deployed with
#   `--alias=main`. Netlify treats an alias matching the production branch as a
#   production deploy, so this prebuilt upload became the published production
#   site - a 3-second deploy with no commit ref and no build log, replacing
#   Netlify's own build of the same commit.
#
#   Two things broke as a result, both silently:
#     - The build ran here, not on Netlify, so CONTEXT was unset. nuxt.config's
#       `gtag.enabled: process.env.CONTEXT === 'production'` was therefore
#       false, nuxt-gtag swapped in its no-op mock, and GA4 recorded nothing at
#       all. No error, no warning, just no tag on the page.
#     - `netlify deploy` has no --functions flag here, so the Nitro server
#       function was never uploaded. /q/* (the QR-code tracking redirects) and
#       every /api/* route returned 404.
#
# Production belongs to Netlify's own Git build. This workflow only ever
# publishes aliases that cannot collide with it.
#
# Requires two GitHub secrets:
#   NETLIFY_AUTH_TOKEN — a Netlify personal access token (User settings → Applications)
#   UI_REPO_TOKEN       — already used by ci.yml (read access to Decipher/sc-ui)

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  NETLIFY_SITE_ID: "90b4ef4c-5133-40ae-850e-77b2808753f1"
  UI_REPO_URL: "https://x-access-token:${{ secrets.UI_REPO_TOKEN }}@github.com/Decipher/sc-ui.git"

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine deploy alias
        id: alias
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            name="pr-$PR_NUMBER"
          else
            name="$REF_NAME"
          fi
          # An alias equal to the production branch makes Netlify publish this
          # prebuilt upload AS production, which is how this workflow took the
          # live site down. The trigger above no longer allows it; this refuses
          # outright, so re-adding main to `push:` fails loudly instead of
          # quietly replacing the production deploy.
          if [ "$name" = "main" ]; then
            echo "::error::Refusing to deploy with --alias=main: Netlify would publish it as production. Production is built by Netlify from main; this workflow must only publish non-production aliases." >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: nuxt/pnpm-lock.yaml

      - name: Clone + build @stuartclark/ui sibling
        run: |
          git clone "${{ env.UI_REPO_URL }}" "$GITHUB_WORKSPACE/../ui"
          cd "$GITHUB_WORKSPACE/../ui"
          pnpm install --frozen-lockfile
          pnpm prepare

      - name: Install nuxt deps
        run: pnpm --dir nuxt install --frozen-lockfile

      - name: Build static site
        run: pnpm --dir nuxt generate
        env:
          SKIP_STORYBOOK: "1"

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@17

      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN secret is not set — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --json prints a single pretty-printed JSON object to stdout (all
          # other logging is suppressed) with a `deploy_url` field — this
          # workflow always deploys via --alias, never --prod, so
          # `deploy_url` (not the prod-only `url` field) is always the one
          # we want. Netlify CLI's human-readable output labels this same
          # value "Website draft URL:" (draft/alias deploys) vs "Website
          # URL:" (--prod only) — a prior version of this script grepped for
          # the latter unconditionally, which silently produced an empty
          # DEPLOY_URL on every run since this workflow never deploys prod.
          OUTPUT=$(netlify deploy \
            --dir=nuxt/dist \
            --site="${{ env.NETLIFY_SITE_ID }}" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --alias="${{ steps.alias.outputs.name }}" \
            --message="Preview: ${{ steps.alias.outputs.name }} (${{ github.sha }})" \
            --json)
          echo "$OUTPUT"

          # jq is the last stage of this pipe, and GitHub Actions runs
          # bash with pipefail — fall back to an empty URL rather than
          # aborting the step if the JSON shape ever changes again.
          DEPLOY_URL=$(echo "$OUTPUT" | jq -r '.deploy_url // empty' || true)
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-deploy -->';
            const alias = '${{ steps.alias.outputs.name }}';
            const url = '${{ steps.deploy.outputs.url }}';
            const body = [
              marker,
              `## Preview site`,
              ``,
              `**${alias}**: ${url}`,
              ``,
              `_Updated ${new Date().toISOString().slice(0,19)}Z_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
