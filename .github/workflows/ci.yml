name: ci

# Mirrors the GitLab CI pipeline (.gitlab-ci.yml) for when GitHub CI is in use.
# Stages map roughly to: lint -> test -> build (+ bundle size check) -> visual.
#
# @stuartclark/ui is consumed as link:../../ui (workspace sibling), so it is
# cloned + built one level above the checkout (matching the GitLab .setup template).
# Set UI_REPO_URL (repo variable) to the ui repo URL on this GitHub instance
# once GitHub is the primary remote.

on:
  push:
    branches: [main, develop, feat/nuxt4]
  pull_request:
    branches: [main, develop, feat/nuxt4]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  UI_REPO_URL: "https://x-access-token:${{ secrets.UI_REPO_TOKEN }}@github.com/Decipher/sc-ui.git"

jobs:
  build:
    name: lint + test + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stuar.tc
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: nuxt/pnpm-lock.yaml

      - name: Clone + build @stuartclark/ui sibling
        run: |
          git clone "${{ env.UI_REPO_URL }}" "$GITHUB_WORKSPACE/../ui"
          cd "$GITHUB_WORKSPACE/../ui"
          pnpm install --frozen-lockfile
          pnpm prepare

      - name: Install nuxt deps
        run: pnpm --dir nuxt install --frozen-lockfile

      - name: Lint
        run: |
          pnpm --dir nuxt lint
          pnpm --dir nuxt lint:style
          pnpm --dir nuxt lint:md
          pnpm --dir nuxt lint:spell
          pnpm --dir nuxt lint:knip

      - name: Typecheck
        run: pnpm --dir nuxt typecheck

      - name: Test (Vitest, full coverage)
        run: pnpm --dir nuxt test:coverage

      - name: Upload coverage report to Codecov
        # Pinned to an immutable SHA (v7.0.0) rather than the mutable @v7 tag —
        # this step receives CODECOV_TOKEN, so a moved tag shouldn't be able to
        # run different code with access to it.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          files: ./nuxt/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build (static generate)
        run: pnpm --dir nuxt generate

      - name: Check client bundle size
        run: pnpm --dir nuxt run size

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: nuxt/dist
          retention-days: 1

  seo:
    name: SEO metadata (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout stuar.tc
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: nuxt/pnpm-lock.yaml

      - name: Clone + build @stuartclark/ui sibling
        run: |
          git clone "${{ env.UI_REPO_URL }}" "$GITHUB_WORKSPACE/../ui"
          cd "$GITHUB_WORKSPACE/../ui"
          pnpm install --frozen-lockfile
          pnpm prepare

      - name: Install nuxt deps
        run: pnpm --dir nuxt install --frozen-lockfile

      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: nuxt/dist

      - name: Install Playwright Chromium
        run: pnpm --dir nuxt exec playwright install --with-deps chromium

      - name: Run SEO suite
        run: pnpm --dir nuxt exec playwright test --project=seo

  audit-seo:
    name: SEO/performance audit (unlighthouse)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout stuar.tc
        uses: actions/checkout@v7
        with:
          # This job has pull-requests: write and later runs
          # repository-controlled lifecycle/build scripts (pnpm install,
          # nuxt generate) — don't leave the job's write-scoped token
          # sitting in .git/config for that code to reach. The PR-comment
          # step uses actions/github-script, which has its own token.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: nuxt/pnpm-lock.yaml

      - name: Clone + build @stuartclark/ui sibling
        run: |
          git clone "${{ env.UI_REPO_URL }}" "$GITHUB_WORKSPACE/../ui"
          cd "$GITHUB_WORKSPACE/../ui"
          pnpm install --frozen-lockfile
          pnpm prepare

      - name: Install nuxt deps
        run: pnpm --dir nuxt install --frozen-lockfile

      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: nuxt/dist

      - name: Install Playwright Chromium
        run: pnpm --dir nuxt exec playwright install --with-deps chromium

      # Exit codes are captured explicitly (rather than letting the step
      # fail outright) so the report-upload and PR-comment steps below still
      # run when a budget is breached — mirrors the GitLab audit:seo job,
      # where after_script always posts the report regardless of job status.
      - name: Run unlighthouse
        id: unlighthouse
        working-directory: nuxt
        run: |
          export CHROME_PATH=$(find "$HOME/.cache/ms-playwright" -path "*/chrome-linux/chrome" -type f | head -1)
          pnpm exec serve -l 4000 dist &
          SERVE_PID=$!
          pnpm exec wait-on http://localhost:4000
          set +e
          pnpm exec unlighthouse-ci --site http://localhost:4000
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          kill $SERVE_PID 2>/dev/null || true

      - name: Check per-metric budgets
        id: budgets
        working-directory: nuxt
        run: |
          set +e
          node scripts/audit-budgets.mjs .unlighthouse --markdown unlighthouse-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload unlighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unlighthouse-report
          path: nuxt/.unlighthouse/
          retention-days: 7

      - name: Post/update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const reportPath = 'nuxt/unlighthouse-report.md'
            if (!fs.existsSync(reportPath)) {
              console.log('No unlighthouse-report.md — skipping comment.')
              return
            }
            const body = fs.readFileSync(reportPath, 'utf8')
            const marker = '<!-- unlighthouse-report -->'
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Enforce audit gate
        if: always()
        run: |
          if [ "${{ steps.unlighthouse.outputs.exit_code }}" != "0" ] || [ "${{ steps.budgets.outputs.exit_code }}" != "0" ]; then
            echo "Unlighthouse audit failed the budget gate." >&2
            exit 1
          fi

  drupal:
    name: Drupal lint + test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup PHP 🐘
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, gd, xml, mbstring, curl, zip, opcache
          coverage: none

      - name: Cache Composer dependencies 📦
        uses: actions/cache@v6
        with:
          path: drupal/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('drupal/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Assemble (composer install) 👨🏻‍💻
        run: cd drupal && ./.devtools/assemble

      - name: Run Drupal PHPCS linting 🔎
        run: cd drupal && vendor/bin/phpcs

      - name: Run Drupal PHPStan analysis 🔎
        run: cd drupal && vendor/bin/phpstan

      - name: Provision (SQLite + Tome import) 👨🏻‍💻
        run: cd drupal && CLOUDFLARE_TUNNEL=0 ./.devtools/provision

      - name: Start dev server (needed for Functional/BrowserTestBase tests) 👨🏻‍💻
        run: cd drupal && CLOUDFLARE_TUNNEL=0 ./.devtools/start

      - name: Run Drupal PHPUnit tests 🧪
        run: cd drupal && SIMPLETEST_BASE_URL=http://127.0.0.1:8888 BROWSERTEST_OUTPUT_DIRECTORY=/tmp vendor/bin/phpunit
