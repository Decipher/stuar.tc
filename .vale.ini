StylesPath = styles
MinAlertLevel = suggestion

# For local dev: `vale sync` reads this to fetch the style package (fine for
# a local run - same trust model as `npm install` without a lockfile hash).
# CI does NOT rely on this: it downloads the same release asset separately,
# verifies its SHA-256, and extracts it into StylesPath itself. If you bump
# this version, update the pinned URL and checksum in .gitlab-ci.yml too -
# both need to move together. Mirrors the setup in druxt/druxt.js#783.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.31.0/ai-tells.zip

# Two hand-authored packages live under styles/ and are committed; only
# styles/ai-tells/ is downloaded, and it's the only one gitignored.
#
#   House/       Product/proper-name casing. Spelling facts, so they apply to
#                everything written here - root docs and article prose alike.
#   StuartVoice/ Voice rules from wiki/content-voice.md. Article prose only:
#                they judge published writing, and firing them at internal
#                instruction docs like AGENTS.md would be a category error.

# ---------------------------------------------------------------------------
# Article prose
# ---------------------------------------------------------------------------
# Lives at the repo root, not nuxt/, so it isn't nuxt-specific: the canonical
# source for article content is drupal/content (Tome-exported node content),
# synced into nuxt/content/articles-data/*.json — see AGENTS.md / the sync
# pipeline. Both should read the same prose; this is set up to eventually
# lint drupal/content directly too, once there's real content on disk there
# to point at (currently just drupal/content/meta, nothing exported yet).
#
# Article prose isn't hand-authored markdown - it's HTML embedded in JSON.
# scripts/extract-article-prose.mjs pulls the title, description, and every
# text_formatted/code/repository paragraph's prose out into plain .html
# files under .vale-extracted/, which is what this section actually lints.
# Never lint the source .json directly: its own syntax (every "key": value
# pair) reads as a colon-then-capital match to ai-tells.ColonUsage.
[.vale-extracted/*.html]
BasedOnStyles = ai-tells, StuartVoice, House

# See druxt/druxt.js#783's .vale.ini for the full reasoning: ColonUsage
# flags any capitalized word after a colon, which is a known limitation of
# the rule (its own docs recommend disabling it where a site has an
# established "label: value" convention). Left enabled here for now since
# stuar.tc's article prose doesn't lean on that pattern the way druxt.js's
# module READMEs do - re-evaluate if it starts flagging false positives.

# Disabled against real findings, not speculatively: a first run against all
# 7 already-published articles (genuinely Stuart-written, pre-dating this
# tool) fired VerbTricolon and ShipOveruse repeatedly on ordinary prose -
# parallel three-item lists and "shipped"/"ships" as release-announcement
# vocabulary are established parts of this site's actual voice (see
# wiki/content-voice.md's "List-first communication" / "Feature-first"
# patterns), not AI tells. Both rules' own docs note they're prone to this
# exact false-positive class ("disable ... for maritime or logistics
# writing" / restructure-or-vary guidance assumes tricolons are rare).
ai-tells.VerbTricolon = NO
ai-tells.ShipOveruse = NO

# ---------------------------------------------------------------------------
# Articles published before this linter existed
# ---------------------------------------------------------------------------
# The seven posts below were written and published before Vale was wired up.
# A first pass over them produced 38 findings, and reading every one showed
# them to be the rule package misreading a human voice rather than prose worth
# changing: "So, no images then?" (a post's own title) as ContrastiveNegation,
# "Well, not exactly." as MicDrop, "of course" as sycophancy, "a single page
# app (SPA)" as a filler intensifier, "Five bug fixes" as a numbered lead-in.
# Rewriting published posts to satisfy those would damage the voice the linter
# is here to protect, and it would edit content whose source of truth is the
# Drupal backend rather than this repository.
#
# So they keep House (product and proper-noun spelling, which is factual) and
# StuartVoice (the author's own rules, including the em dash ban), and drop
# ai-tells. Anything published after this was added is linted in full: a new
# article is not on this list, so it gets the whole set, and the current draft
# passes it at zero. Delete a line here if a post is ever revised.
[.vale-extracted/nuxt-{hello-world-20211126,layout-paragraphs-module-20220301,what-no-images-20220315,decoupling-configuration-config-pages-20220412,field-tokens-200-20260722,custom-formatters-410-20260731,jsonapi-views-120-20260812}.html]
BasedOnStyles = StuartVoice, House

# ---------------------------------------------------------------------------
# Root docs
# ---------------------------------------------------------------------------
# Same four files lint:docs and linkcheck already cover, so the doc set stays
# consistent across all three jobs. House only, not StuartVoice: these are
# reference/instruction docs, not published prose. Not extended into
# nuxt/content/** - that collection is synced from the Drupal backend at
# content-sync time (see sync:drupal-content in .gitlab-ci.yml and
# wiki/architecture.md) rather than hand-authored here, so it's linted via
# the extraction step above instead.
[{README,AGENTS,CONTRIBUTING}.md]
BasedOnStyles = ai-tells, House

# Unlike article prose, these docs use a `**Term**: description` colon-bullet
# convention throughout; ai-tells.ColonUsage misreads it as a hedge or
# dash-avoidance tell on essentially every line.
ai-tells.ColonUsage = NO

# ---------------------------------------------------------------------------
# CHANGELOG
# ---------------------------------------------------------------------------
# House only. The file declares that it follows Keep a Changelog, and the
# vocabulary that format prescribes is what ai-tells flags: "All notable
# changes to this project will be documented in this file" is the spec's own
# opening line, scored as OverusedVocabulary. The rest of a release log is
# enumerated fact ("Four new paragraph types", "The four legacy redirects")
# and release vocabulary ("ship", "shipped"), which CataphoricForecasting and
# ShipOveruse read as tells. Nine findings, no sentence among them worth
# changing. Spelling and proper nouns still apply, which is what House is for.
[CHANGELOG.md]
BasedOnStyles = House
